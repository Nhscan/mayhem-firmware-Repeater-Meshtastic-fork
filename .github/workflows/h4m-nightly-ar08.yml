name: Build H4M nightly 2026-11-21
on:
  push:
    branches: ['build/h4m-nightly-20261121']
permissions:
  contents: write
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Integrate pinned upstream nightly
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags https://github.com/portapack-mayhem/mayhem-firmware.git refs/tags/nightly-tag-2026-11-21
          upstream=$(git rev-parse FETCH_HEAD^{commit})
          test "$upstream" = afc728338907a1dcbde26daf7f8b96152080015b
          git merge --no-edit "$upstream" || { git diff --name-only --diff-filter=U; exit 1; }
          git submodule update --init --recursive
      - name: Compile and validate
        run: |
          set -e
          source_dir=$(pwd)
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y git tar wget dfu-util cmake python3 python3-pyelftools python3-lz4 python3-yaml ccache bzip2 liblz4-tool curl ninja-build
          
          mkdir -p $RUNNER_TEMP/arm
          cd $RUNNER_TEMP/arm
          wget -O gcc-arm-none-eabi "https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2019q4/gcc-arm-none-eabi-9-2019-q4-major-x86_64-linux.tar.bz2?revision=108bd959-44bd-4619-9c19-26187abf5225&la=en&hash=E788CE92E5DFD64B2A8C246BBA91A249CB8E2D2D"
          mkdir -p armbin
          tar --strip=1 -xjf gcc-arm-none-eabi -C armbin
          export PATH=$RUNNER_TEMP/arm/armbin/bin:$PATH
          cd "$source_dir"
          python3 tools/update_external_tier_ld.py
          cmake -S . -B build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DMAYHEM_CUSTOM_VERSION=n_261121_ar08
          cmake --build build --target oci -j6
          python3 tests/auto_repeater/check_layout.py build
          python3 tests/auto_repeater/check_runtime_memory.py build
          python3 tests/auto_repeater/check_install.py build n_261121_ar08
      - name: Package Flash Utility update
        run: |
          tar --format=ustar -cf H4M_AR08.ppfw.tar -C build/firmware/firmware_tar APPS BASEBAND FIRMWARE
          python3 tests/auto_repeater/check_update_archive.py H4M_AR08.ppfw.tar n_261121_ar08
          sha256sum H4M_AR08.ppfw.tar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: H4M-AR08-Nightly
          path: |
            H4M_AR08.ppfw.tar
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish verified test firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:refs/heads/build/h4m-nightly-20261121
          gh release create ar08 H4M_AR08.ppfw.tar SHA256SUMS.txt --target "$(git rev-parse HEAD)" --prerelease --title "H4M ar08 · November 21 nightly" --notes "Community test build for HackRF One + PortaPack H4M. Includes Auto Repeater, Meshtastic, and the Msg chat-history fix. Copy the intact H4M_AR08.ppfw.tar into /FIRMWARE and select it in Utilities > Flash Utility. After reboot, About should show n_261121_ar08. On-device testing is pending."
