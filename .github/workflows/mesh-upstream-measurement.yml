name: Meshtastic upstream integration measurement
on:
  push:
    branches: [build/meshtastic-upstream-measurement]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Meshtastic-only measurement candidate
        run: |
          git fetch --depth 1 origin fix/meshtastic-rx-window
          git restore --source FETCH_HEAD -- firmware/application/apps/ui_meshtastic.cpp firmware/application/apps/ui_meshtastic.hpp firmware/baseband/proc_lora.cpp firmware/baseband/proc_lora.hpp firmware/baseband/proc_lora_tx.cpp firmware/baseband/proc_lora_tx.hpp firmware/baseband/lora_taps.hpp firmware/application/external/meshtastic/main.cpp firmware/application/external/meshtastic/ui_meshtastic_launcher.cpp
          git apply ci/mesh-measurement.patch
          git submodule update --init --recursive
          python3 tools/update_external_tier_ld.py
      - name: Run host regressions
        run: make -C tools/lora_bench
      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3-yaml python3-pyelftools python3-lz4 lz4 dfu-util
          mkdir -p "$RUNNER_TEMP/arm"
          wget -qO "$RUNNER_TEMP/arm/toolchain.tar.bz2" https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2019q4/gcc-arm-none-eabi-9-2019-q4-major-x86_64-linux.tar.bz2
          tar -xjf "$RUNNER_TEMP/arm/toolchain.tar.bz2" -C "$RUNNER_TEMP/arm"
          echo "$RUNNER_TEMP/arm/gcc-arm-none-eabi-9-2019-q4-major/bin" >> "$GITHUB_PATH"
      - name: Measure isolated firmware flash and memory
        run: |
          set -o pipefail
          export VERSION_STRING=n_261123_meshprobe
          cmake -S . -B build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 2>&1 | tee configure.log
          cmake --build build --target oci -j4 2>&1 | tee build.log
          arm-none-eabi-size build/firmware/application/application.elf build/firmware/baseband/baseband_lora_rx.elf build/firmware/baseband/baseband_lora_tx.elf | tee sizes.log
      - name: Save measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-upstream-measurement-logs
          path: |
            configure.log
            build.log
            sizes.log
            build/firmware/application/application.map
            build/firmware/baseband/baseband_lora_rx.map
            build/firmware/baseband/baseband_lora_tx.map
          if-no-files-found: warn
